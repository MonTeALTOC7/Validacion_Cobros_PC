<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Negocios de Caña CASUR</title>
  <script>
    /* GitHub Pages sirve este archivo ante rutas no encontradas.
       Como la App Maestra usa enrutado por hash, redirigimos a la
       raíz de la app conservando cualquier #hash de ruta profunda. */
    (function () {
      var base = location.pathname.replace(/\/[^\/]*$/, '/');
      location.replace(base + (location.hash || ''));
    })();
  </script>
</head>
