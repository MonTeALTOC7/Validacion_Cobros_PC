# Temporal: sincroniza el release revisable del PR de auditoría.
# Solo puede operar sobre feature/auditoria-tarifas-cobros; no cambia producción.
name: Auditoría - sincronizar build de revisión

on:
  push:
    branches:
      - feature/auditoria-tarifas-cobros

permissions:
  contents: write

concurrency:
  group: auditoria-release-feature
  cancel-in-progress: true

jobs:
  sincronizar:
    if: github.ref == 'refs/heads/feature/auditoria-tarifas-cobros'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout de rama de revisión
        uses: actions/checkout@v5
        with:
          ref: feature/auditoria-tarifas-cobros
          fetch-depth: 1

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalación determinista
        working-directory: app
        run: npm ci

      - name: Formato exclusivo del rediseño
        working-directory: app
        run: npx prettier --write src/components/audit/AuditWorkQueue.jsx src/components/audit/TariffAuditPanel.jsx tests/e2e/tariff-audit.mjs

      - name: Generar build y release de la rama
        working-directory: app
        run: npm run release

      - name: Versionar solo fuente revisada y salida estática
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/auditoria-tarifas-cobros"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app/src/components/audit/AuditWorkQueue.jsx app/src/components/audit/TariffAuditPanel.jsx app/src/components/audit/tariff-audit.css app/tests/e2e/tariff-audit.mjs
          for item in assets index.html sw.js registerSW.js manifest.webmanifest icon.svg casur-mark.svg casur-logo.png; do
            if test -e "$item" || git ls-files --error-unmatch "$item" >/dev/null 2>&1; then
              git add -A -- "$item"
            fi
          done
          for item in workbox-*.js; do
            if test -e "$item"; then git add -A -- "$item"; fi
          done
          while IFS= read -r item; do
            git add -A -- "$item"
          done < <(git ls-files 'workbox-*.js')
          if ! git diff --cached --quiet; then
            git diff --cached --name-only
            git commit -m "build(auditoria): release reproducible del rediseño para QA"
            git push origin HEAD:refs/heads/feature/auditoria-tarifas-cobros
          else
            echo "Release ya sincronizado."
          fi
